<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title id="pageTitle">OSORI15 — Haute Couture & Female Fashion</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0f0f10;
            --text-color: #f3f3f3;
            --header-color: rgba(15, 15, 16, 0.95);
            --footer-color: #070d1d;
            --topbar-color: #070d1d;
            --gold-gradient: linear-gradient(135deg, #d4af37, #f3e5ab);
            --accent-amber: #d4af37;
            --site-font: 'Plus Jakarta Sans', sans-serif;
            --card-min-width: 240px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--site-font); -webkit-tap-highlight-color: transparent; }

        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        .serif { font-family: 'Playfair Display', serif; }
        
        .top-bar { background: var(--topbar-color); border-bottom: 1px solid rgba(212, 175, 55, 0.2); font-size: 12px; color: #d1d5db; padding: 8px 16px; }
        .top-bar-inner { max-width: 1280px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        
        header { position: sticky; top: 0; z-index: 40; background: var(--header-color); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(212, 175, 55, 0.3); min-height: 60px; display: flex; align-items: center; }
        .header-inner { max-width: 1280px; margin: 0 auto; width: 100%; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        
        .logo { display: flex; align-items: center; gap: 10px; cursor: pointer; text-decoration: none; color: white; }
        .logo-icon { width: 38px; height: 38px; border-radius: 12px; background: var(--gold-gradient); display: flex; align-items: center; justify-content: center; color: black; font-size: 16px; flex-shrink: 0; }
        
        nav { display: flex; gap: 16px; font-size: 14px; font-weight: 500; flex-wrap: wrap; }
        nav button { background: none; border: none; color: #e5e7eb; cursor: pointer; transition: color 0.2s; white-space: nowrap; }
        nav button:hover, nav button.active { color: #d4af37; }

        .actions { display: flex; align-items: center; gap: 8px; }
        .btn-icon { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(212, 175, 55, 0.3); color: #e5e7eb; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; transition: 0.2s; flex-shrink: 0; }
        .btn-icon:hover { border-color: #d4af37; color: #d4af37; }
        
        .badge { position: absolute; top: -4px; right: -4px; background: #d4af37; color: black; font-size: 10px; font-weight: bold; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        
        .main-content { flex-grow: 1; max-width: 1280px; margin: 0 auto; width: 100%; padding: 24px 16px; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        .grid-products { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--card-min-width), 1fr)); gap: 20px; }
        
        .card { background: #18181a; border-radius: 16px; overflow: hidden; color: #f3f3f3; border: 1px solid #2a2a2d; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: flex; flex-direction: column; position: relative; width: 100%; }

        .card-img-slider { position: relative; width: 100%; aspect-ratio: 3 / 4; background: #121214; overflow: hidden; cursor: pointer; }
        .card-img-track { display: flex; width: 100%; height: 100%; transition: transform 0.2s; }
        .card-img-track img { width: 100%; height: 100%; object-fit: cover; flex-shrink: 0; }
        
        .card-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); color: white; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; z-index: 5; }
        .card-arrow-left { left: 8px; }
        .card-arrow-right { right: 8px; }
        
        .card-dots { position: absolute; bottom: 8px; left: 0; right: 0; display: flex; justify-content: center; gap: 4px; z-index: 2; pointer-events: none; }
        .card-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.4); }
        .card-dot.active { background: #d4af37; width: 12px; border-radius: 4px; }

        .card-body { padding: 16px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        
        .btn-gold { background: var(--gold-gradient); color: black; font-weight: bold; border: none; padding: 12px 20px; border-radius: 12px; cursor: pointer; width: 100%; font-size: 14px; text-transform: uppercase; }
        .btn-whatsapp { background: #25d366; color: white; font-weight: bold; border: none; padding: 10px 14px; border-radius: 10px; cursor: pointer; width: 100%; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; margin-top: 8px; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 16px; }
        .modal.open { display: flex; }
        .modal-box { background: #18181a; color: #f3f3f3; border: 1px solid #2a2a2d; width: 100%; max-width: 550px; border-radius: 24px; padding: 24px; position: relative; max-height: 90dvh; overflow-y: auto; }
        .modal-close { position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 20px; cursor: pointer; color: #a0a0a5; z-index: 10; }
        
        #fullscreenModal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); z-index: 200; display: none; align-items: center; justify-content: center; flex-direction: column; }
        #fullscreenModal.open { display: flex; }
        #fullscreenImg { max-width: 95vw; max-height: 85vh; object-fit: contain; border-radius: 8px; }
        .fs-close { position: absolute; top: 20px; right: 20px; color: white; font-size: 28px; background: rgba(255,255,255,0.1); border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        form div { margin-bottom: 14px; }
        form label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: #a0a0a5; text-transform: uppercase; }
        form input, form textarea, form select { width: 100%; padding: 10px 14px; background: #222225; border: 1px solid #2a2a2d; color: #f3f3f3; border-radius: 10px; font-size: 14px; }
        
        footer { background: var(--footer-color); border-top: 1px solid rgba(212, 175, 55, 0.2); padding: 32px 16px; margin-top: 40px; color: #9ca3af; font-size: 13px; text-align: center; }
        .hidden { display: none !important; }
        .text-gold { color: #d4af37; }
        .text-amber { color: #d4af37; }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <div class="logo" onclick="switchTab('catalog')">
                <div class="logo-icon"><i class="fa-solid fa-gem"></i></div>
                <div>
                    <span style="font-size: 20px; font-weight: 900; letter-spacing: 1px;" class="serif">OSORI15</span>
                    <span style="display: block; font-size: 8px; color: #d4af37; letter-spacing: 2px; font-weight: 600;">HAUTE COUTURE</span>
                </div>
            </div>

            <nav>
                <button onclick="switchTab('home')" class="nav-btn active">Главная</button>
                <button onclick="switchTab('catalog')" class="nav-btn">Каталог</button>
            </nav>

            <div class="actions">
                <button id="addProductBtn" onclick="openProductModal()" class="btn-icon hidden" title="Добавить товар" style="background: #d4af37; color: black; border-color: #d4af37; font-weight: bold;">
                    <i class="fa-solid fa-plus"></i>
                </button>
                <button id="adminOrdersBtn" onclick="openAdminModal()" class="btn-icon hidden" title="Заказы" style="color: #d4af37; border-color: rgba(212,175,55,0.4);">
                    <i class="fa-solid fa-file-lines"></i>
                    <span id="adminBadge" class="badge hidden">0</span>
                </button>
                <button onclick="openCartModal()" class="btn-icon" title="Корзина">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span id="cartBadge" class="badge hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div id="tab-home" class="tab-pane active">
            <div style="padding: 20px 0; text-align: center;">
                <h1 class="serif" style="font-size: 32px; margin-bottom: 15px; color: #d4af37;">OSORI15 FASHION</h1>
                <p style="color: #a0a0a5; margin-bottom: 25px;">Премиальная женская одежда в Душанбе</p>
                <button onclick="switchTab('catalog')" class="btn-gold" style="width: auto; padding: 12px 30px;">Перейти в каталог</button>
            </div>
            <div id="homeGrid" class="grid-products"></div>
        </div>

        <div id="tab-catalog" class="tab-pane">
            <h2 class="serif" style="font-size: 24px; margin-bottom: 20px;">Каталог одежды</h2>
            <div id="catalogGrid" class="grid-products"></div>
        </div>
    </main>

    <!-- ПОЛНОЭКРАННЫЙ ПРОСМОТР -->
    <div id="fullscreenModal">
        <button class="fs-close" onclick="closeFullscreen()"><i class="fa-solid fa-xmark"></i></button>
        <img id="fullscreenImg" src="" alt="Full view" style="max-width: 95vw; max-height: 85vh; object-fit: contain;">
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ТОВАРА -->
    <div id="productModal" class="modal">
        <div class="modal-box">
            <button onclick="closeModal('productModal')" class="modal-close"><i class="fa-solid fa-xmark"></i></button>
            <h3 id="productModalTitle" class="serif" style="font-size: 22px; margin-bottom: 16px;">Добавить товар</h3>
            <form onsubmit="saveProduct(event)">
                <input type="hidden" id="editProductDocId">
                <div><label>Название</label><input type="text" id="prodName" required placeholder="Платье"></div>
                <div><label>Категория / Бренд</label><input type="text" id="prodBrand" required placeholder="Платья"></div>
                <div><label>Цена (в TJS)</label><input type="number" id="prodPrice" required min="1" placeholder="650"></div>
                
                <div>
                    <label id="uploadLabelText">Фотография товара</label>
                    <input type="file" id="prodImageFiles" accept="image/*" multiple onchange="handleMultipleImagesUpload(event)">
                    <div id="uploadedImagesPreview" style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px;"></div>
                </div>
                
                <button type="submit" id="saveProductSubmitBtn" class="btn-gold" style="margin-top: 10px;">Сохранить товар</button>
            </form>
        </div>
    </div>

    <div id="adminModal" class="modal">
        <div class="modal-box">
            <button onclick="closeModal('adminModal')" class="modal-close"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="serif" style="font-size: 22px; margin-bottom: 16px;">Панель заказов</h3>
            <div id="adminOrdersContainer" style="display: flex; flex-direction: column; gap: 10px;"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, deleteDoc, onSnapshot, query, orderBy, updateDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDL3fvNpu8FfZBY85gpg4FjQ_0GcMwr-pY",
            authDomain: "osori-17.firebaseapp.com",
            projectId: "osori-17",
            storageBucket: "osori-17.appspot.com",
            messagingSenderId: "112011730643",
            appId: "1:112011730643:web:d39e3dd3c286bd36a5fe26"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ADMINS = ["samirdv888@gmail.com", "abdullochoriev4242@gmail.com"];
        let currentUser = null;
        window.tempProductBase64Images = [];
        window.products = [];

        // Загрузка товаров из базы
        onSnapshot(query(collection(db, "products"), orderBy("timestamp", "desc")), (snapshot) => {
            window.products = [];
            snapshot.forEach(docSnap => {
                let data = docSnap.data();
                window.products.push({ id: docSnap.id, ...data, images: data.images || [data.image] });
            });
            renderProducts();
        });

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const addBtn = document.getElementById('addProductBtn');
            const adminBtn = document.getElementById('adminOrdersBtn');
            if (user && ADMINS.includes(user.email.toLowerCase())) {
                addBtn.classList.remove('hidden');
                adminBtn.classList.remove('hidden');
            } else {
                addBtn.classList.add('hidden');
                adminBtn.classList.add('hidden');
            }
            renderProducts();
        });

        // Мгновенная и легкая обработка фото
        window.handleMultipleImagesUpload = async (event) => {
            const files = Array.from(event.target.files);
            window.tempProductBase64Images = [];
            const previewContainer = document.getElementById('uploadedImagesPreview');
            
            if (!files.length) return;

            for (let file of files) {
                const base64 = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.src = e.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let w = img.width, h = img.height;
                            let max = 600;
                            if (w > max || h > max) {
                                if (w > h) { h = Math.round((h * max) / w); w = max; }
                                else { w = Math.round((w * max) / h); h = max; }
                            }
                            canvas.width = w; canvas.height = h;
                            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                            resolve(canvas.toDataURL('image/jpeg', 0.6));
                        };
                    };
                    reader.readAsDataURL(file);
                });
                window.tempProductBase64Images.push(base64);
            }

            previewContainer.innerHTML = window.tempProductBase64Images.map(img => `
                <img src="${img}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 1px solid #d4af37;">
            `).join('');
        };

        // Молниеносное сохранение в базу
        window.saveProduct = async (e) => {
            e.preventDefault();
            if (!currentUser || !ADMINS.includes(currentUser.email.toLowerCase())) return;

            const editId = document.getElementById('editProductDocId').value;
            const name = document.getElementById('prodName').value;
            const brand = document.getElementById('prodBrand').value;
            const priceTJS = parseFloat(document.getElementById('prodPrice').value);
            const images = window.tempProductBase64Images;

            if (images.length === 0) {
                alert("Выберите фото!");
                return;
            }

            const productData = {
                name, brand, priceTJS,
                images, image: images[0],
                timestamp: Date.now()
            };

            try {
                if (editId) {
                    await updateDoc(doc(db, "products", editId), productData);
                } else {
                    await addDoc(collection(db, "products"), productData);
                }
                closeModal('productModal');
            } catch (err) {
                alert("Ошибка: уменьшите количество фото (выберите 1-3 штуки).");
            }
        };

        window.openProductModal = () => {
            document.getElementById('editProductDocId').value = '';
            document.getElementById('prodName').value = '';
            document.getElementById('prodBrand').value = '';
            document.getElementById('prodPrice').value = '';
            document.getElementById('uploadedImagesPreview').innerHTML = '';
            window.tempProductBase64Images = [];
            openModal('productModal');
        };

        window.deleteProduct = async (id) => {
            if (confirm("Удалить товар?")) deleteDoc(doc(db, "products", id));
        };

        window.openModal = (id) => document.getElementById(id).classList.add('open');
        window.closeModal = (id) => document.getElementById(id).classList.remove('open');
    </script>

    <script>
        window.renderProducts = function() {
            const list = window.products || [];
            const html = list.map(p => `
                <div class="card">
                    <div class="card-img-slider" onclick="openFullscreen('${p.images[0]}')">
                        <img src="${p.images[0]}" alt="${p.name}" style="width:100%; height:100%; object-fit:cover;">
                    </div>
                    <div class="card-body">
                        <div>
                            <span style="font-size: 11px; color: #d4af37; text-transform: uppercase;">${p.brand}</span>
                            <h3 style="font-size: 16px; margin: 4px 0 10px;" class="serif">${p.name}</h3>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #2a2a2d; padding-top: 10px;">
                            <span style="font-size: 16px; font-weight: 700;" class="text-amber">${p.priceTJS} ЅM</span>
                            ${isAdminUser() ? `<button onclick="deleteProduct('${p.id}')" style="background: #dc2626; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 11px;">Удалить</button>` : ''}
                        </div>
                    </div>
                </div>
            `).join('');

            if (document.getElementById('homeGrid')) document.getElementById('homeGrid').innerHTML = html;
            if (document.getElementById('catalogGrid')) document.getElementById('catalogGrid').innerHTML = html;
        };

        function isAdminUser() {
            const ADMINS = ["samirdv888@gmail.com", "abdullochoriev4242@gmail.com"];
            const activeUser = window.firebaseAuth ? window.firebaseAuth.currentUser : null;
            return activeUser && ADMINS.includes(activeUser.email.toLowerCase());
        }

        window.openFullscreen = (url) => {
            document.getElementById('fullscreenImg').src = url;
            document.getElementById('fullscreenModal').classList.add('open');
        };
        window.closeFullscreen = () => document.getElementById('fullscreenModal').classList.remove('open');
        window.switchTab = (tab) => {
            document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
        };
    </script>
</body>
</html>
